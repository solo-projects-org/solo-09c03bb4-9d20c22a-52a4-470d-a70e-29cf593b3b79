services:
  ferry-iceberg-check:
    build: .
    image: ferry-iceberg-check:latest
    init: true
    ports:
      - "8000:8000"
    environment:
      MAX_UPLOAD_MB: "512"
      REPORT_TTL_SECONDS: "3600"
    volumes:
      - reconcile-reports:/app/var/reconcile-reports
    restart: unless-stopped

volumes:
  reconcile-reports:
